<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Blog Post</title>

    <!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-B0QVHK527M"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-B0QVHK527M');
	</script>

    <link rel="icon" href="terminal.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #0b0c0e;
            --bg-panel: #131417;
            --bg-elev: #1a1c20;
            --border: #24262b;
            --text: #eef0f2;
            --text-muted: #9ba0a8;
            --text-faint: #5c6169;
            --accent: #2ecc71;
            --accent-strong: #4ade80;
            --accent-soft: rgba(46, 204, 113, 0.12);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: #06210f; }
        a { color: inherit; }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 40px 32px 70px 32px;
        }

        header {
            margin-bottom: 36px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--accent-strong); }

        .post-meta-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            font-size: 0.82rem;
            color: var(--text-faint);
        }

        .post-category {
            display: inline-flex;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--accent-strong);
            background: var(--accent-soft);
            border-radius: 999px;
            padding: 3px 10px;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .post-excerpt {
            color: var(--text-muted);
            font-size: 1.08rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .post-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding-bottom: 24px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .tag {
            font-size: 0.78rem;
            color: var(--text-faint);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 10px;
        }

        .post-content {
            font-size: 1.02rem;
            line-height: 1.85;
            color: var(--text);
        }

        .post-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 42px 0 16px 0;
        }

        .post-content h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 30px 0 12px 0;
        }

        .post-content p { margin-bottom: 20px; color: var(--text-muted); }

        .post-content a {
            color: var(--accent-strong);
            text-decoration: underline;
            text-decoration-color: rgba(74, 222, 128, 0.35);
            text-underline-offset: 3px;
        }
        .post-content a:hover { text-decoration-color: var(--accent-strong); }

        .post-content ul, .post-content ol {
            margin: 18px 0 20px 0;
            padding-left: 22px;
            color: var(--text-muted);
        }
        .post-content li { margin-bottom: 8px; }

        .post-content blockquote {
            margin: 26px 0;
            padding: 16px 20px;
            border-left: 3px solid var(--accent);
            background: var(--bg-panel);
            border-radius: 0 8px 8px 0;
            color: var(--text-muted);
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 26px 0;
            border-radius: 12px;
            display: block;
        }

        .post-content img.img-small { max-width: 300px; margin: 20px auto; }
        .post-content img.img-medium { max-width: 600px; margin: 26px auto; }
        .post-content img.img-large { max-width: 100%; margin: 26px 0; }
        .post-content img.img-full { width: 100%; max-width: 100%; margin: 26px 0; }

        .post-content img.img-left { float: left; margin: 8px 20px 8px 0; max-width: 380px; }
        .post-content img.img-right { float: right; margin: 8px 0 8px 20px; max-width: 380px; }
        .post-content img.img-center { display: block; margin-left: auto; margin-right: auto; }

        .post-content img.img-rounded { border-radius: 16px; }
        .post-content img.img-circle { border-radius: 50%; aspect-ratio: 1/1; object-fit: cover; }
        .post-content img.img-shadow { box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        .post-content img.img-border { border: 1px solid var(--border); padding: 6px; background: var(--bg-panel); }

        @media (max-width: 768px) {
            .post-content img.img-left,
            .post-content img.img-right {
                float: none;
                max-width: 100%;
                margin: 20px 0;
            }
        }

        .post-content code {
            font-family: var(--mono);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.88em;
            color: var(--accent-strong);
        }

        .post-content pre {
            margin: 24px 0;
            padding: 18px 20px;
            background: #0e0f11;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow-x: auto;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 26px 0;
            font-size: 0.92rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .post-content table th {
            background: var(--bg-panel);
            color: var(--text);
            font-weight: 700;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .post-content table td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            vertical-align: top;
        }
        .post-content table tbody tr:last-child td { border-bottom: none; }
        .post-content table tbody tr td { background: var(--bg); }
        .post-content table tbody tr:hover td { background: var(--bg-panel); }

        .post-content pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: inherit;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-faint);
            font-size: 0.85rem;
        }

        .author-box {
            margin-top: 44px;
            padding: 24px 26px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-soft);
            flex-shrink: 0;
            object-fit: cover;
        }

        .author-box h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .author-box p {
            color: var(--text-faint);
            font-size: 0.88rem;
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 18px; }
        }

        .loading {
            text-align: center;
            color: var(--text-faint);
            padding: 60px 20px;
        }
        .loading h2 { color: var(--text); margin-bottom: 10px; font-size: 1.3rem; }
        .loading a { color: var(--accent-strong); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="blog.html" class="back-link">← Back to Blog</a>
        </header>

        <article id="postContent">
            <div class="loading">Loading post...</div>
        </article>

        <footer>
            <p>© 2026 0xRoot</p>
        </footer>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postSlug = urlParams.get('slug');

        async function loadPost() {
            try {
                const response = await fetch(`json/posts/${postSlug}.json`);
                const post = await response.json();

                if (!response.ok || !post) {
                    document.getElementById('postContent').innerHTML = `
                        <div class="loading">
                            <h2>Post not found</h2>
                            <p>The post you're looking for doesn't exist.</p>
                            <br>
                            <a href="blog.html">← Back to Blog</a>
                        </div>
                    `;
                    return;
                }

                document.getElementById('pageTitle').textContent = post.title;

                document.getElementById('postContent').innerHTML = `
                    <div class="post-meta-top">
                        <span class="post-category">${post.category}</span>
                        <span>${formatDate(post.date)}</span>
                    </div>
                    <h1>${post.title}</h1>
                    <p class="post-excerpt">${post.excerpt}</p>
                    ${post.tags.length > 0 ? `
                        <div class="post-tags">
                            ${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                    ${post.image ? `<img src="${post.image}" alt="${post.title}" onerror="this.style.display='none'" style="width:100%;margin:30px 0;border-radius:12px;">` : ''}
                    <div class="post-content">
                        ${post.content}
                    </div>
                    <div class="author-box">
                        <img class="author-avatar" src="avatar.jpeg" alt="Kanchana Samarakoon">
                        <div>
                            <h3>Kanchana Samarakoon</h3>
                            <p>ICT Graduate | Linux & AI Enthusiast | Technology-Driven Innovator</p>
                        </div>
                    </div>
                `;

                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('postContent').innerHTML = `
                    <div class="loading">
                        <h2>Error loading post</h2>
                        <p>There was an error loading this post.</p>
                        <br>
                        <a href="blog.html">← Back to Blog</a>
                    </div>
                `;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
        }

        loadPost();
    </script>
</body>
</html>
