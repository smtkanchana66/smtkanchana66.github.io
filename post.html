<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Blog Post</title>

    <!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-B0QVHK527M"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}
	  gtag('js', new Date());

	  gtag('config', 'G-B0QVHK527M');
	</script>

    <link rel="icon" href="crab.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: #060a06;
            --bg-panel: #0a100a;
            --bg-input: #081008;
            --green: #3dff8f;
            --green-bright: #a8ffce;
            --green-dim: #5e8f70;
            --border: #1d3324;
            --text: #a9dab8;
            --text-dim: #557a63;
            --font: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background:
                repeating-linear-gradient(180deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(61,255,143,0.025) 3px, rgba(61,255,143,0.025) 4px),
                radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.35) 100%);
        }

        ::selection { background: var(--green); color: #04140a; }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 30px 60px 30px;
        }

        header {
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .back-link {
            color: var(--green-dim);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link::before { content: '$ '; color: var(--green); }

        .back-link:hover {
            color: var(--green-bright);
        }

        .post-header {
            margin-bottom: 34px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            padding: 24px 28px;
        }

        .file-line {
            color: var(--green-dim);
            font-size: 0.82rem;
            margin-bottom: 16px;
        }
        .file-line .prompt { color: var(--green); }

        .post-date {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--green-bright);
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .post-excerpt {
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .post-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
            font-size: 0.85rem;
        }

        .post-category {
            color: var(--green-dim);
        }
        .post-category::before { content: '['; }
        .post-category::after { content: ']'; }

        .post-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            color: var(--text-dim);
        }

        .post-content {
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
        }

        .post-content h2 {
            font-size: 1.5rem;
            color: var(--green-bright);
            margin: 38px 0 18px 0;
            font-weight: 700;
        }
        .post-content h2::before { content: '## '; color: var(--green-dim); }

        .post-content h3 {
            font-size: 1.2rem;
            color: var(--green);
            margin: 28px 0 14px 0;
            font-weight: 700;
        }
        .post-content h3::before { content: '### '; color: var(--green-dim); }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content a {
            color: var(--green);
            text-decoration: underline;
            text-decoration-color: var(--border);
            text-underline-offset: 3px;
        }

        .post-content a:hover {
            color: var(--green-bright);
            text-decoration-color: var(--green);
        }

        .post-content ul, .post-content ol {
            margin: 20px 0;
            padding-left: 26px;
        }

        .post-content ul { list-style: none; padding-left: 6px; }
        .post-content ul li::before {
            content: '> ';
            color: var(--green-dim);
        }

        .post-content li {
            margin-bottom: 10px;
        }

        .post-content blockquote {
            margin: 28px 0;
            padding: 14px 20px;
            border-left: 2px solid var(--green-dim);
            background: var(--bg-panel);
            color: var(--text-dim);
        }
        .post-content blockquote::before {
            content: '# ';
            color: var(--green-dim);
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 28px 0;
            border: 1px solid var(--border);
            display: block;
            filter: grayscale(0.5) contrast(1.1) brightness(0.85) sepia(0.25) hue-rotate(65deg) saturate(2);
        }

        /* Image size classes */
        .post-content img.img-small { max-width: 300px; margin: 20px auto; }
        .post-content img.img-medium { max-width: 600px; margin: 28px auto; }
        .post-content img.img-large { max-width: 100%; margin: 28px 0; }
        .post-content img.img-full { width: 100%; max-width: 100%; margin: 28px 0; }

        /* Image alignment classes */
        .post-content img.img-left {
            float: left;
            margin: 10px 20px 10px 0;
            max-width: 380px;
        }
        .post-content img.img-right {
            float: right;
            margin: 10px 0 10px 20px;
            max-width: 380px;
        }
        .post-content img.img-center {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Image style classes — kept minimal, no rounding/glow to fit theme */
        .post-content img.img-rounded { border-radius: 2px; }
        .post-content img.img-circle { border-radius: 50%; aspect-ratio: 1/1; object-fit: cover; }
        .post-content img.img-shadow { box-shadow: 0 0 0 1px var(--green-dim); }
        .post-content img.img-border { border: 1px solid var(--green-dim); padding: 6px; background: var(--bg-panel); }

        @media (max-width: 768px) {
            .post-content img.img-left,
            .post-content img.img-right {
                float: none;
                max-width: 100%;
                margin: 20px 0;
            }
        }

        .post-content code {
            font-family: var(--font);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 2px 6px;
            font-size: 0.92em;
            color: var(--green);
        }

        .post-content pre {
            margin: 24px 0;
            padding: 18px 20px;
            background: #0c0c0c;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        /* Table */
        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 26px 0;
            font-size: 0.92rem;
            border: 1px solid var(--border);
        }
        .post-content table th {
            background: var(--bg-panel);
            color: var(--green-bright);
            font-weight: 700;
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .post-content table td {
            padding: 11px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            vertical-align: top;
            line-height: 1.6;
        }
        .post-content table tbody tr:last-child td { border-bottom: none; }
        .post-content table tbody tr td { background: var(--bg); }
        .post-content table tbody tr:hover td { background: var(--bg-panel); }

        .post-content pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: inherit;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        footer p::before { content: '// '; color: var(--green-dim); }

        .author-box {
            margin-top: 44px;
            padding: 22px 24px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
        }

        .author-box .file-line {
            margin-bottom: 10px;
        }

        .author-box h3 {
            margin-bottom: 8px;
            color: var(--green-bright);
            font-size: 1.05rem;
        }

        .author-box p {
            color: var(--text-dim);
            line-height: 1.6;
            font-size: 0.9rem;
        }

        a:focus-visible {
            outline: 1px solid var(--green);
            outline-offset: 2px;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 18px; }
            h1 { font-size: 1.5rem; }
            .post-content h2 { font-size: 1.3rem; }
            .post-content h3 { font-size: 1.1rem; }
            .post-header { padding: 18px 20px; }
        }

        .loading {
            text-align: center;
            color: var(--text-dim);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="blog.html" class="back-link">cd ..</a>
        </header>

        <article id="postContent">
            <div class="loading">loading post...</div>
        </article>

        <footer>
            <p>© 2026 // K66 // EOF</p>
        </footer>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postSlug = urlParams.get('slug');

        async function loadPost() {
            try {
                const response = await fetch(`json/posts/${postSlug}.json`);
                const post = await response.json();

                if (!response.ok || !post) {
                    document.getElementById('postContent').innerHTML = `
                        <div class="loading">
                            <h2>404 :: post not found</h2>
                            <p>the file you're looking for doesn't exist.</p>
                            <br>
                            <a href="blog.html" style="color: #3dff8f;">$ cd ..</a>
                        </div>
                    `;
                    return;
                }

                document.getElementById('pageTitle').textContent = post.title;

                document.getElementById('postContent').innerHTML = `
                    <div class="post-header">
                        <div class="file-line"><span class="prompt">$</span> cat posts/${postSlug}.md</div>
                        <div class="post-date">${formatDate(post.date)}</div>
                        <h1>${post.title}</h1>
                        <p class="post-excerpt">${post.excerpt}</p>
                        <div class="post-meta">
                            <span class="post-category">${post.category}</span>
                            ${post.tags.length > 0 ? `
                                <div class="post-tags">
                                    ${post.tags.map(tag => `<span class="tag">#${tag}</span>`).join(' ')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    ${post.image ? `<img src="${post.image}" alt="${post.title}" onerror="this.style.display='none'" style="width:100%;margin-bottom:30px;border:1px solid #1d3324;filter:grayscale(0.5) contrast(1.1) brightness(0.85) sepia(0.25) hue-rotate(65deg) saturate(2);">` : ''}
                    <div class="post-content">
                        ${post.content}
                    </div>
                    <div class="author-box">
                        <div class="file-line"><span class="prompt" style="color:#3dff8f;">$</span> whoami</div>
                        <h3>Kanchana Samarakoon</h3>
                        <p>ICT Graduate | Linux & AI Enthusiast | Technology-Driven Innovator</p>
                    </div>
                `;

                document.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });

            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('postContent').innerHTML = `
                    <div class="loading">
                        <h2>error loading post</h2>
                        <p>there was an error loading this post.</p>
                        <br>
                        <a href="blog.html" style="color: #3dff8f;">$ cd ..</a>
                    </div>
                `;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
        }

        loadPost();
    </script>
</body>
</html>
