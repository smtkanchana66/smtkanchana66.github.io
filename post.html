<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog Post</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-B0QVHK527M"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-B0QVHK527M');
</script>
<link rel="icon" href="terminal.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*{box-sizing:border-box}
:root{--mono:"Courier New",Courier,monospace;--serif:"Times New Roman",Times,Georgia,serif}
[hidden]{display:none!important}
html{background:#fff}
body{margin:0 auto;max-width:900px;padding:8px 16px 32px;font:16px/1.4 var(--serif);background:#fff;color:#000}
a{color:#00e;text-decoration:underline}a:visited{color:#551a8b}a:hover{color:#e00}
button{font:inherit;color:#00e;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
button:hover{color:#e00}
::selection{background:#000;color:#fff}
.gh-header{border-bottom:1px solid #000;padding:8px 0 4px}
.wrap,.header-row{max-width:none;margin:0;padding:0}
.header-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:16px}
.brand,.brand:visited{display:inline-flex;align-items:center;gap:6px;margin-right:auto;color:#000;font-size:28px;font-weight:bold;text-decoration:none}
.brand:hover{color:#000;text-decoration:underline}
.brand img{width:20px;height:20px;object-fit:contain}
.gh-header .brand,.brand{font-family:var(--serif)}
.footer-rule{border-top:1px solid #000}
footer{margin-top:24px;border-top:1px solid #000;padding:8px 0 0;color:#000;font-size:14px;text-align:left}
footer p{margin:4px 0}footer .social-links{display:flex;gap:12px;margin:4px 0}
.container{max-width:none;padding:12px 0 0}
.back-link{display:inline-block;margin-bottom:12px}
.post-meta-top{display:flex;gap:8px;font-size:14px;color:#555}
.post-category::before{content:"["}.post-category::after{content:"]"}
h1{margin:4px 0;font-size:30px;line-height:1.2}
.post-excerpt{margin:0 0 8px;font-style:italic}
.post-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:14px;color:#555}
.post-cover{display:block;max-width:100%;margin:8px 0;border:1px solid #000}
.post-content{padding:8px 0 0;border-top:1px solid #000;font-size:17px;line-height:1.5;word-wrap:break-word}
.post-content::after{content:"";display:table;clear:both}
.post-content :is(p,ul,ol,pre,table,blockquote){margin:0 0 14px}
.post-content :is(h1,h2,h3,h4,h5,h6){margin:22px 0 8px;line-height:1.2}
.post-content h1{font-size:26px}.post-content h2{font-size:22px;border-bottom:1px solid #999}.post-content h3{font-size:18px}.post-content :is(h4,h5,h6){font-size:16px}
.post-content :is(ul,ol){padding-left:32px}
.post-content blockquote{padding:0 16px;margin-left:16px;border-left:3px solid #999;color:#333}
.post-content hr{border:0;border-top:1px solid #000;margin:20px 0}
.post-content code{font:.9em var(--mono);padding:0 3px;background:#eee}
.post-content pre{padding:8px;background:#f6f6f6;border:1px solid #999;overflow:auto;font-size:14px;line-height:1.35}
.post-content pre code,.post-content pre code.hljs{display:block;padding:0;background:transparent;font-size:inherit;white-space:pre}
.post-content table{border-collapse:collapse;display:block;max-width:100%;overflow:auto}
.post-content :is(th,td){padding:3px 8px;border:1px solid #000}.post-content th{background:#eee}
.post-content img{display:block;max-width:100%;height:auto;margin:12px 0}
.post-content img.img-small{max-width:300px;margin:12px auto}.post-content img.img-medium{max-width:600px;margin:12px auto}
.post-content img.img-large{max-width:100%}.post-content img.img-full{width:100%;max-width:100%}
.post-content img.img-left{float:left;margin:6px 16px 6px 0;max-width:380px}.post-content img.img-right{float:right;margin:6px 0 6px 16px;max-width:380px}
.post-content img.img-center{margin-left:auto;margin-right:auto}.post-content img.img-rounded{border-radius:12px}
.post-content img.img-circle{border-radius:50%;aspect-ratio:1/1;object-fit:cover}
.post-content img.img-shadow{box-shadow:3px 3px 6px rgba(0,0,0,.4)}.post-content img.img-border{border:1px solid #000;padding:4px;background:#fff}
.author-box{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:8px;border-top:1px solid #000}
.author-avatar{width:48px;height:48px;object-fit:cover;border:1px solid #000;flex-shrink:0}
.author-box h3{margin:0;font-size:16px}.author-box p{margin:0;font-size:14px;color:#555}
.loading{padding:24px 0;color:#555}.loading h2{margin:0 0 4px;color:#000;font-size:20px}
@media(max-width:768px){.post-content img.img-left,.post-content img.img-right{float:none;max-width:100%;margin:12px 0}}
</style>
</head>
<body>
<header class="gh-header"><div class="header-row">
  <a class="brand" href="blog.html"><img src="terminal.ico" alt="" onerror="this.style.display='none'">0xRoot</a>
</div></header>

<main class="container">
  <a href="blog.html" class="back-link">← Back to Blog</a>
  <article id="postContent"><div class="loading">Loading post...</div></article>
</main>
<footer><p>© 2026 0xRoot</p></footer>

<script>
const slug = new URLSearchParams(window.location.search).get('slug');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function showMessage(title, text) {
  document.getElementById('postContent').innerHTML =
    `<div class="loading"><h2>${title}</h2><p>${text}</p><br><a href="blog.html">← Back to Blog</a></div>`;
}

function formatDate(d) {
  const date = new Date(d);
  if (isNaN(date)) return '';
  const utc = /^\d{4}-\d{2}-\d{2}$/.test(String(d).trim());
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${m[utc ? date.getUTCMonth() : date.getMonth()]} ${utc ? date.getUTCDate() : date.getDate()}, ${utc ? date.getUTCFullYear() : date.getFullYear()}`;
}

async function loadPost() {
  if (!slug) { showMessage('Post not found', "The post you're looking for doesn't exist."); return; }
  try {
    const response = await fetch(`json/posts/${encodeURIComponent(slug)}.json`);
    if (!response.ok) { showMessage('Post not found', "The post you're looking for doesn't exist."); return; }
    const post = await response.json();
    if (!post) { showMessage('Post not found', "The post you're looking for doesn't exist."); return; }

    const tags = Array.isArray(post.tags) ? post.tags : [];
    document.getElementById('pageTitle').textContent = post.title;
    document.getElementById('postContent').innerHTML = `
      <div class="post-meta-top">
        ${post.category ? `<span class="post-category">${post.category}</span>` : ''}
        <span>${formatDate(post.date)}</span>
      </div>
      <h1>${post.title}</h1>
      <p class="post-excerpt">${post.excerpt || ''}</p>
      ${tags.length ? `<div class="post-tags">${tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
      ${post.image ? `<img class="post-cover" src="${esc(post.image)}" alt="${esc(post.title)}" onerror="this.style.display='none'">` : ''}
      <div class="post-content">${post.content || ''}</div>
      <div class="author-box">
        <img class="author-avatar" src="avatar.jpeg" alt="Kanchana Samarakoon" onerror="this.style.display='none'">
        <div>
          <h3><a href="https://github.com/smtkanchana66">Kanchana Samarakoon</a></h3>
          <p>ICT Graduate | Linux & AI Enthusiast | Technology-Driven Innovator</p>
        </div>
      </div>`;

    if (typeof hljs !== 'undefined') {
      document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    }
  } catch (error) {
    console.error('Error loading post:', error);
    showMessage('Error loading post', 'There was an error loading this post.');
  }
}

loadPost();
</script>
</body>
</html>
